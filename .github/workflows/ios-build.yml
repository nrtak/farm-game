name: iOS build
on:
  push:
    branches: [ios-preparation]
  workflow_dispatch:
    inputs:
      diagnose_crash:
        description: Rebuild crash symbols without uploading an app
        type: boolean
        default: false
      upload_existing:
        description: Upload the verified signed build 2 to TestFlight
        type: boolean
        default: false
      upload_testflight:
        description: Upload the new signed build to TestFlight
        type: boolean
        default: false
      signed:
        description: Produce a signed App Store IPA
        type: boolean
        default: false
      version:
        description: App version
        default: '0.1.0'
        required: true
      build:
        description: Unique increasing build number
        default: '1'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: ${{ inputs.diagnose_crash }}
    uses: ./.github/workflows/ios-crash-check.yml
  build:
    if: ${{ !inputs.upload_existing && !inputs.diagnose_crash }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: ${{ inputs.signed && 'ios' || 'ios-check' }}
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APP_VERSION: ${{ inputs.version || '0.1.0' }}
      BUILD_NUMBER: ${{ inputs.build || github.run_number }}
      SIGNED_BUILD: ${{ inputs.signed || false }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode SDK
        shell: bash
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          [[ "${sdk%%.*}" -ge 26 ]]
      - name: Install Godot and iOS template
        run: bash ci/install_godot.sh
      - name: Import and check game
        run: |
          "$GODOT_BIN" --headless --path . --import
          python3 ci/run_checks.py
      - name: Install Apple signing
        if: inputs.signed
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash ci/install_signing.sh
      - name: Build iOS
        run: bash ci/build_ios.sh
      - name: Save build
        uses: actions/upload-artifact@v4
        with:
          name: tea-blossom-hills-ios-${{ inputs.build || github.run_number }}
          path: |
            export/ios-unsigned-app.tar.gz
            export/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload new build to TestFlight
        if: inputs.signed && inputs.upload_testflight
        shell: bash
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/apple-upload-key"
          mkdir -p "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          ipa=$(find export/ipa -name '*.ipa' -type f)
          [[ -n "$ipa" && "$(printf '%s\n' "$ipa" | wc -l | tr -d ' ')" = 1 ]]
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove upload key
        if: always() && inputs.signed && inputs.upload_testflight
        run: rm -rf "$RUNNER_TEMP/apple-upload-key"
      - name: Remove temporary signing materials
        if: always() && inputs.signed
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/coastal-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [[ -n "${PROFILE_PATH:-}" ]]; then rm -f "$PROFILE_PATH"; fi
  upload:
    if: inputs.upload_existing
    runs-on: macos-26
    timeout-minutes: 30
    environment: ios
    steps:
      - name: Download verified signed build
        uses: actions/download-artifact@v4
        with:
          name: tea-blossom-hills-ios-2
          run-id: 37508737464
          github-token: ${{ github.token }}
          path: signed-build
      - name: Upload to App Store Connect
        shell: bash
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/apple-upload-key"
          mkdir -p "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          export API_PRIVATE_KEYS_DIR="$key_dir"
          ipa=$(find signed-build -name '*.ipa' -type f)
          [[ -n "$ipa" && "$(printf '%s\n' "$ipa" | wc -l | tr -d ' ')" = 1 ]]
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove upload key
        if: always()
        run: rm -rf "$RUNNER_TEMP/apple-upload-key"

